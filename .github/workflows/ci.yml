# CI gate. Runs on every push and PR, and must pass before a deploy is
# considered good — the reviewer feedback specifically called out CI that runs
# on PRs but does not actually gate anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is required: the render fallback is what makes
      # JS-rendered sites work, and a suite that silently skips those tests
      # would report green while that capability is broken.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Next generates route/layout types (LayoutProps, PageProps) into
      # .next/types. Those do not exist in a fresh checkout, so tsc must run
      # after typegen or it fails on types the framework owns. Cheaper than a
      # full build, and keeps typecheck ahead of the slower steps.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  # Builds the container image on every push to main. Docker is not available
  # on the dev machine this was written on, so without this the Dockerfile
  # would be an untested claim — and "the deploy image builds" is exactly the
  # thing you want to learn from CI rather than from a failed deploy.
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vercel
          push: false
          load: true
          tags: llms-txt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Chromium actually launches inside the image
        run: |
          # The whole point of the container is that Playwright works in it.
          # Building successfully proves nothing about that.
          docker run --rm llms-txt:ci node -e "
            const { chromium } = require('playwright');
            chromium.launch({ headless: true })
              .then(async (b) => {
                const page = await b.newPage();
                await page.setContent('<h1>ok</h1>');
                const text = await page.textContent('h1');
                await b.close();
                if (text !== 'ok') throw new Error('unexpected render: ' + text);
                console.log('Chromium launched and rendered inside the image');
              })
              .catch((e) => { console.error(e); process.exit(1); });
          "

  # Deploys only run when `verify` passed. Without needs:, a deploy job runs
  # in parallel with the tests and ships whatever CI was about to reject.
  deploy:
    needs: [verify, container]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment gate
        run: |
          echo "CI passed on main."
          echo "Vercel's Git integration deploys from this commit."
          echo "To make the gate binding, disable Vercel's automatic deploys and"
          echo "run 'vercel deploy --prod' here with a VERCEL_TOKEN secret."
