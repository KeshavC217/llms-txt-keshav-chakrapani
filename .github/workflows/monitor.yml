name: Monitor

# Sites are re-checked on a schedule so a file does not quietly go stale when
# the site it describes is reorganised. The endpoint does the deciding; this
# only wakes it up.
on:
  schedule:
    # Every fifteen minutes, offset so it never fires on the hour: GitHub
    # documents that scheduled events are delayed under load, that "high load
    # times include the start of every hour", and that queued jobs may be
    # dropped outright.
    #
    # This is not how often a site is checked - that is a flat six hours per
    # site, in lib/monitor.ts. It is how precisely a site that has become due
    # gets picked up: fifteen minutes of slack on a six-hour interval is four
    # percent, which nobody can perceive in a file about a website, and it is
    # a quarter of the runs for the same result.
    #
    # GitHub also disables schedules on repositories with no activity for 60
    # days, so a quiet repository stops monitoring without saying so.
    - cron: "7,22,37,52 * * * *"
  # Available by hand, which is how it gets tested without waiting six hours.
  workflow_dispatch:

# A run that overruns must not have the next one pile up behind it: the
# endpoint would hand both the same due rows, and they would crawl the same
# sites twice.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Work through everything that is due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi

          # The loop lives here rather than inside the function.
          #
          # A serverless function on this plan is killed at 60 seconds, so one
          # call can only ever handle a slice of the queue. This runner has six
          # hours. Calling the endpoint until it reports nothing left to do
          # removes the ceiling from the batch while leaving each individual
          # call comfortably inside it.
          #
          # The crawling itself deliberately stays on the deployment: that is
          # where the code and the credentials already are, and requests from a
          # shared CI address are far more likely to be met with an anti-bot
          # challenge than requests from the app's own host.
          total=0
          for pass in $(seq 1 20); do
            response=$(curl --fail-with-body --silent --show-error --max-time 120 \
              -X POST "$APP_URL/api/refresh" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")

            checked=$(printf '%s' "$response" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['checked']))")
            considered=$(printf '%s' "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['considered'])")
            total=$((total + checked))

            printf 'pass %s: %s checked, %s due\n' "$pass" "$checked" "$considered"
            printf '%s' "$response" | python3 -m json.tool | head -40

            # Nothing checked means nothing is due, which is the ordinary
            # outcome and not worth another round trip.
            if [ "$checked" -eq 0 ]; then
              break
            fi
          done

          echo "checked $total site(s) in total"
