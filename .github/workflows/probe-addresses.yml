name: Probe addresses

# Throwaway. Answers one question before the worker is built: does crawling from
# a GitHub runner meet more anti-bot challenges than crawling from the app's own
# host? monitor.yml asserts it does, and that assertion was never measured.
# Delete this workflow once the answer is recorded.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm i -g npm@11.19.1
      - run: npm ci
      - name: Fetch representative sites and report how each answered
        run: node --experimental-strip-types scripts/probe-addresses.ts
